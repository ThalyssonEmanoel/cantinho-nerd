appId: app.rpgmesa.cantinhonerd
productName: Cantinho Nerd
copyright: Cantinho Nerd

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!docs/**'
  - '!supabase/**'
  - '!site/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts}'
  - '!eslint.config.mjs'
  - '!{.env,.env.*,.env.example,.prettierrc,.prettierignore,.editorconfig,.eslintcache}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.tsbuildinfo}'
  - '!{CLAUDE.md,README.md}'

win:
  executableName: cantinho-nerd
  target:
    - nsis

nsis:
  # Instalação por usuário: não pede senha de administrador no Windows.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cantinho Nerd
  uninstallDisplayName: Cantinho Nerd
  artifactName: Cantinho-Nerd-${version}-setup.${ext}

# Registra o esquema do deep link: rpgmesa://join/<inviteId>
protocols:
  - name: Cantinho Nerd
    schemes:
      - rpgmesa

# A publicação no GitHub Releases (e o electron-updater) entram na Fase 12.
publish: null
