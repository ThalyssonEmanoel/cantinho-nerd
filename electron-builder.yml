appId: app.rpgmesa.cantinhonerd
productName: Cantinho Nerd
copyright: Cantinho Nerd

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!docs/**'
  - '!supabase/**'
  - '!site/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts}'
  - '!eslint.config.mjs'
  - '!{.env,.env.*,.env.example,.prettierrc,.prettierignore,.editorconfig,.eslintcache}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.tsbuildinfo}'
  - '!{CLAUDE.md,README.md}'

win:
  executableName: cantinho-nerd
  target:
    - nsis

nsis:
  # Instalação por usuário: não pede senha de administrador no Windows.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cantinho Nerd
  uninstallDisplayName: Cantinho Nerd
  artifactName: Cantinho-Nerd-${version}-setup.${ext}

# Registra o esquema do deep link: rpgmesa://join/<inviteId>
protocols:
  - name: Cantinho Nerd
    schemes:
      - rpgmesa

# Atualização automática (decisão 78). O GitHub Actions (.github/workflows/release.yml) gera
# o instalador e publica numa release do GitHub; este bloco também grava no instalador o
# `app-update.yml`, que diz ao app instalado onde procurar a versão nova (o `latest.yml` da
# release mais recente). O repositório é público: o app não leva token nenhum.
#
# `releaseType: release` publica a release direto, sem rascunho. Rascunho não aparece para o
# app, e a versão ficaria parada esperando alguém clicar em "Publish" no site.
#
# O `npm run build:win` local continua sem publicar nada: fora do CI, o electron-builder só
# publica com `--publish`.
publish:
  provider: github
  owner: ThalyssonEmanoel
  repo: cantinho-nerd
  releaseType: release
